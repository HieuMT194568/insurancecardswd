# Chạy với SQL Server:  DB_VENDOR=sqlserver
# Tạo database trước bằng database/sqlserver/00_create_database.sql
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=InsuranceCard;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        # Map String -> NVARCHAR để lưu tiếng Việt có dấu
        use_nationalized_character_data: true
